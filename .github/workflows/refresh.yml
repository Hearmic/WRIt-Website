name: Refresh data

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC
  workflow_dispatch:
    inputs:
      sets:
        description: "Datasets to fetch: all, or a comma list of A-F (A rents, B CMHC, C census, D fertility, E LTB, F shelters)"
        default: "all"
        required: true

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose datasets
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sets=${{ github.event.inputs.sets }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "sets=A,B,D,E,F" >> "$GITHUB_OUTPUT"   # Mondays: weekly sets plus shelters
          else
            echo "sets=F" >> "$GITHUB_OUTPUT"           # other days: shelters only
          fi

      # A failed dataset keeps its previous files; the others still update.
      # The job is marked failed at the end so the failure is visible.
      - name: Fetch
        id: fetch
        run: |
          set +e
          python scripts/fetch_data.py --sets "${{ steps.pick.outputs.sets }}"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit data/ if it changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh data (${{ steps.pick.outputs.sets }}) $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if any fetch failed
        if: steps.fetch.outputs.status != '0'
        run: |
          echo "::error::One or more datasets failed to fetch; see the Fetch step log. Previous files were kept."
          exit 1
